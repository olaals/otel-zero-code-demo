services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weatherwatch
      POSTGRES_USER: weatherwatch
      POSTGRES_PASSWORD: weatherwatch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=weatherwatch;Username=weatherwatch;Password=weatherwatch"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
